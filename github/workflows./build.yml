name: Build iOS IPA App for QsaXosh AI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Cordova / Capacitor Wrapper
      run: |
        npm install -g cordova
        cordova create qsaxoxapp com.yuseef.qsaxosh QsaXoshAI
        cd qsaxoxapp
        # لێرە مێشکێ وێبسایتی دێ تێکەینە ناو ئەپی
        cp ../index.html www/index.html
        cordova platform add ios

    - name: Build iOS Archive and IPA (Support iOS 17 - iOS 27)
      run: |
        cd qsaxoxapp
        # دیارکرنا دەستپێکا پشتیڤانیا iOS 17 بەرەو ژۆر تا نووترین ڤێرژن
        sed -i '' 's/<preference name="deployment-target" value=".*" \/>/<preference name="deployment-target" value="17.0" \/>/g' config.xml
        cordova build ios --release --codeSignIdentity="" --developmentTeam=""
        
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: QsaXoshAI-IPA
        path: qsaxoxapp/platforms/ios/build/device/*.ipa
